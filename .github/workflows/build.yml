name: EyeCare Android 云端自动化构建打包

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击立即触发构建

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予创建 Release 和上传 Release Assets 的写入权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 设置 Android SDK 缓存
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 初始化 Gradle Wrapper (确保版本匹配 AGP 8.2)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x ./gradlew

      - name: 执行 Gradle 构建生成 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传构建工件 (Actions Artifacts 备份)
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 自动发布到 GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "EyeCare 20-20-20 自动构建 v1.0.${{ github.run_number }}"
          body: |
            ## EyeCare 20-20-20 护眼助手
            - **纯视觉静默运行**：无声音、无任何震动。
            - **20-20-20 规则**：每 20 分钟亮屏弹出半透明深色全屏悬浮遮罩，倒计时 20 秒后自动平滑淡出关闭并循环。
            - **安装说明**：请直接在下方 **Assets** 附件列表中点击下载 `.apk` 安装包。
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

