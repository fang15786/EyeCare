name: EyeCare Android 云端自动化构建打包

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击立即触发构建

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予创建 Release 和上传 Release Assets 的写入权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 设置并锁定 Gradle 8.2 环境
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 执行 Gradle 构建生成 Debug APK
        run: gradle assembleDebug --stacktrace


      - name: 上传构建工件 (Actions Artifacts 备份)
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 自动发布到 GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "EyeCare 自动构建 v1.0.${{ github.run_number }}"
          body: |
            ## EyeCare 护眼助手
            - **纯视觉静默运行**：无声音、无任何震动。
            - **智能遮罩防疲劳**：亮屏达到预设时长自动弹出半透明深色全屏悬浮遮罩，倒计时 20 秒后自动平滑淡出关闭并循环。
            - **短视频自动暂停**：看抖音等视频时弹出遮罩自动暂停，遮罩结束后自动恢复播放。
            - **安装说明**：请直接在下方 **Assets** 附件列表中点击下载 `.apk` 安装包。
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

