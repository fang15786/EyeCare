name: EyeCare Android 云端自动化构建打包

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击立即触发构建

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 设置 Android SDK 缓存
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 Gradle Wrapper 可执行权限 (若存在)
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: 执行 Gradle 构建生成 Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 上传构建产物 (APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
